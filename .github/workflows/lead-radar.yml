name: Daily lead radar

on:
  schedule:
    - cron: "0 12 * * *"  # 08:00 EDT daily, after the trend radar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for buying signals
        run: python3 .github/scripts/lead_radar.py
      - name: Commit leads
        run: |
          git config user.name "rock-ops"
          git config user.email "rock-ops@users.noreply.github.com"
          git add ops/leads/
          git diff --cached --quiet || git commit -m "lead radar $(date +%F)"
          git push
