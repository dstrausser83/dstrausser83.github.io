name: Hourly uptime monitor

on:
  schedule:
    - cron: "7 * * * *"  # hourly (GitHub throttles public cron to ~30-60 min)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe site
        run: python3 .github/scripts/uptime.py
      - name: Commit on change
        run: |
          git config user.name "rock-ops"
          git config user.email "rock-ops@users.noreply.github.com"
          git add ops/status.json
          git diff --cached --quiet || git commit -m "uptime $(date -u +%FT%TZ)"
          git push
