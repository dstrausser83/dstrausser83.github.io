name: Daily trend radar

on:
  schedule:
    - cron: "0 11 * * *"  # 07:00 EDT daily, before the morning briefing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan feeds
        run: python3 .github/scripts/trend_radar.py
      - name: Commit intel
        run: |
          git config user.name "rock-ops"
          git config user.email "rock-ops@users.noreply.github.com"
          git add ops/intel/
          git diff --cached --quiet || git commit -m "trend radar $(date +%F)"
          git push
