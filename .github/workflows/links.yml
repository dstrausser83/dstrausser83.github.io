name: Weekly link check

on:
  schedule:
    - cron: "0 12 * * 1"  # Mondays 08:00 EDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-redirects 5 https://deadbrands.co/
        continue-on-error: true
      - name: Save report
        if: always()
        run: |
          mkdir -p ops/reports
          {
            echo "# Link check — $(date +%F)"
            echo ""
            echo '```'
            cat lychee/out.md 2>/dev/null || echo "(no lychee output file)"
            echo '```'
          } > ops/reports/links-$(date +%F).md
          git config user.name "rock-ops"
          git config user.email "rock-ops@users.noreply.github.com"
          git add ops/reports/links-$(date +%F).md
          git diff --cached --quiet || git commit -m "link check $(date +%F)"
          git push
