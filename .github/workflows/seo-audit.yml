name: Daily SEO/AEO audit

on:
  schedule:
    - cron: "30 10 * * *"  # 06:30 EDT daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic audit
        run: python3 .github/scripts/seo_audit.py
      - name: Commit report
        run: |
          git config user.name "rock-ops"
          git config user.email "rock-ops@users.noreply.github.com"
          git add ops/reports/
          git diff --cached --quiet || git commit -m "SEO/AEO audit $(date +%F)"
          git push
